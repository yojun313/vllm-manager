# Based on vllm-project/vllm-omni aff7d64948f6c0e81e9b3272234623044e215967.
# Text output only; accepts multimodal inputs. Also usable with Instruct weights.
pipeline: qwen3_omni_moe_thinker_only
distributed_executor_backend: mp
enable_prefix_caching: true
stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.9
    max_model_len: 8192
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    enforce_eager: true
    async_scheduling: false
    moe_backend: triton
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05
