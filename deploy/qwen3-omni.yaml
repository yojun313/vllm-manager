# Based on vllm-project/vllm-omni aff7d64948f6c0e81e9b3272234623044e215967.
# A100 80GB x2 starting profile; actual model inference still requires validation.
# GPU indices are local to the container, not host GPU indices.
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25
stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.9
    max_model_len: 8192
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    enforce_eager: true
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
  - stage_id: 1
    devices: "1"
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.6
    max_model_len: 8192
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    enforce_eager: true
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      seed: 42
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      repetition_penalty: 1.05
  - stage_id: 2
    devices: "1"
    gpu_memory_utilization: 0.1
    max_num_seqs: 1
    max_num_batched_tokens: 65536
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.1
platforms:
  cuda:
    stages:
      - stage_id: 0
        compilation_config:
          custom_ops: ["+rotary_embedding"]
