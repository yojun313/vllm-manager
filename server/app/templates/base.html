<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0d14">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}vLLM Manager{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/icons/server.svg">
  <link rel="apple-touch-icon" href="/icons/server.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/js/boot.js?v={{ version }}"></script>
  <link rel="stylesheet" href="/css/app.css?v={{ version }}">
</head>
<body class="{% block body_class %}{% endblock %}" data-version="{{ version }}">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
