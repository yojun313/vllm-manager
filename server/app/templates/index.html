{% extends "base.html" %}
{% block body_class %}app{% endblock %}
{% block body %}
<div class="nav-overlay" id="navOverlay" hidden></div>
<aside class="sidebar" id="sidebar">
  <a class="side-brand" href="#/"><img src="/icons/server.svg" alt="" width="34" height="34"><span class="side-label"><b>vLLM</b> Manager</span></a>
  <nav class="side-nav" id="sideNav" aria-label="Main"></nav>
  <div class="side-bottom">
    <nav class="side-nav" id="sideNavBottom"></nav>
    <button class="nav-link" id="collapseSidebar" type="button"><span class="nav-icon" data-icon="collapse"></span><span class="side-label" data-i18n="nav.collapse"></span></button>
    <div class="side-foot side-label"><span id="sideVersion">v{{ version }}</span><a href="https://github.com/yojun313/vllm-manager" target="_blank" rel="noopener noreferrer">GitHub</a></div>
  </div>
</aside>
<div class="shell">
  <header class="top">
    <button class="btn ghost icon" id="menuToggle" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button>
    <div class="top-title"><h1 id="pageTitle"></h1><div class="top-sub mono" id="pageSub"></div></div>
    <div class="sp"></div>
    <div class="live" id="live"><span class="dot" id="liveDot"></span><span id="liveTxt"></span></div>
    <button class="btn ghost" id="jobsBtn"><span data-icon="activity"></span><span class="hide-sm" data-i18n="nav.activity"></span><span class="badge" id="jobsBadge" hidden></span></button>
    <button class="btn ghost icon" id="langBtn"></button>
    <button class="btn ghost icon" id="themeToggle"><span data-icon="moon"></span></button>
    <button class="btn ghost icon" id="logoutBtn"><span data-icon="logout"></span></button>
  </header>
  <div id="banners"></div>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-h">
    <h3 id="sheetTitle"></h3>
    <button class="btn ghost sm" id="sheetAction" hidden></button>
    <button class="btn ghost sm" id="followBtn" hidden></button>
    <button class="btn ghost sm icon" id="sheetClose"><span data-icon="x"></span></button>
  </div>
  <div class="sheet-progress" id="sheetProgress" hidden></div>
  <div class="sheet-b" id="sheetBody"></div>
</aside>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
{% endblock %}
{% block scripts %}<script type="module" src="/js/app.js?v={{ version }}"></script>{% endblock %}
